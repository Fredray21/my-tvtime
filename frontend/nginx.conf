server {
    listen 80;
    
    root /usr/share/nginx/html;
    index index.html;

    # C'est cette ligne qui fait toute la magie pour React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service worker & scripts PWA : jamais en cache, sinon les mises à jour
    # (dont la gestion des notifications push) n'arriveraient pas sur les appareils
    location ~ ^/(sw\.js|push-sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # Optimisation optionnelle pour garder les assets en cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|json)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}